<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeTube profile mockup (temp)</title>
<style>
/* inverse of YouTube light theme; sizes measured from youtube.com channel page 2026-10-20 */
:root {
  --bg: #000000;
  --chip: #0d0d0d;
  --hover: #262626;  /* hover fill; exact inverse #0d0d0d was 1.08:1 on --bg, invisible */
  --text: #f0f0f0;
  --text-2: #9f9f9f;
  --accent: #0013de; /* fills only, white text on it */
  --link: #f9a02b;
  --mint: #00ffcc;   /* inverse of brand red #ff0033 */
  --on-accent: #ffffff; /* text on --accent */
  --line: rgba(255,255,255,.1);
  --field-line: #606060; /* control border, 3.3:1 on --bg; exact inverse #333333 was 1.7:1 */
  --field-btn: #1a1a1a;
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px Roboto, Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.header { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px; background: var(--bg); z-index: 2; }
.header .left, .header .right { display: flex; align-items: center; gap: 16px; min-width: 200px; }
.header .right { justify-content: flex-end; }
.logo { display: flex; align-items: center; gap: 4px; font-size: 20px; font-weight: 700; letter-spacing: -1px; }
.logo i { background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 4px 10px; font-style: normal; }
.search { display: flex; width: min(640px, 40vw); }
.search input { flex: 1; height: 40px; border: 1px solid var(--field-line); border-radius: 20px 0 0 20px; padding: 0 16px;
  background: var(--bg); color: var(--text); font-size: 16px; }
.search button { width: 64px; border: 1px solid var(--field-line); border-left: 0; border-radius: 0 20px 20px 0; background: var(--field-btn); color: var(--text); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); }
.icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: none; border: 0; color: var(--text); font-size: 18px; }
.icon:hover { background: var(--hover); }

.guide { position: fixed; top: 56px; bottom: 0; width: 72px; padding: 4px; background: var(--bg); }
.guide a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: 64px; border-radius: 10px; font-size: 11px; }
.guide a:hover { background: var(--hover); }

.main { margin: 56px 0 0 72px; padding: 0 24px 48px; }
.wrap { max-width: 1284px; margin: 0 auto; }

.banner { height: 138px; margin-top: 16px; border-radius: 16px; background: linear-gradient(120deg, var(--accent), var(--mint)); }
.head { display: flex; gap: 24px; padding: 16px 0 12px; align-items: center; }
.big-avatar { width: 160px; height: 160px; flex: none; border-radius: 50%; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-size: 64px; font-weight: 500; }
.info h1 { font-size: 36px; line-height: 44px; font-weight: 700; }
.info .meta { color: var(--text-2); font-size: 14px; line-height: 20px; margin-top: 4px; }
.info .meta b { color: var(--text); font-weight: 500; }
.info .bio { color: var(--text-2); margin-top: 8px; max-width: 560px; line-height: 20px; }
.info .bio a { color: var(--link); }
.sub-btn { margin-top: 16px; height: 36px; padding: 0 16px; border: 0; border-radius: 18px; background: var(--text); color: var(--bg);
  font: 500 14px Roboto, Arial, sans-serif; cursor: pointer; }
.sub-btn.on { background: var(--field-btn); color: var(--text); box-shadow: inset 0 0 0 1px var(--field-line); }

.tabs { display: flex; height: 48px; border-bottom: 1px solid var(--line); margin-top: 8px; }
.tabs a { padding: 0 16px; display: grid; place-items: center; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; }
.tabs a:hover { color: var(--text); }
.tabs a.on { color: var(--text); border-bottom-color: var(--text); }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 16px; padding-top: 24px; }
@media (max-width: 1500px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, 1fr); } .head { flex-direction: column; align-items: flex-start; } }
.thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; }
.dur { position: absolute; right: 8px; bottom: 8px; background: #000c; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.title { margin-top: 12px; font-size: 16px; font-weight: 500; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sub { color: var(--text-2); line-height: 20px; margin-top: 4px; }
</style>
</head>
<body>
<header class="header">
  <div class="left"><button class="icon">&#9776;</button><a class="logo" href="mockup-temp.html"><i>Me</i>Tube</a></div>
  <form class="search" onsubmit="return false"><input placeholder="Search"><button>&#128269;</button></form>
  <div class="right"><button class="icon">+</button><button class="icon">&#128276;</button><div class="avatar"></div></div>
</header>

<nav class="guide">
  <a href="mockup-temp.html">&#8962;<span>Home</span></a>
  <a href="#">&#9654;<span>Shorts</span></a>
  <a href="#">&#9733;<span>Subs</span></a>
  <a href="#">&#9786;<span>You</span></a>
</nav>

<main class="main"><div class="wrap">
  <div class="banner"></div>
  <section class="head">
    <div class="big-avatar">D</div>
    <div class="info">
      <h1>DeepFake Studio</h1>
      <div class="meta"><b>@deepfake</b> &middot; 48.3K subscribers &middot; 12 videos</div>
      <p class="bio">Fake videos, real effort. School project channel. <a href="#">deepfake.example</a></p>
      <button class="sub-btn" id="sub">Subscribe</button>
    </div>
  </section>

  <nav class="tabs"><a href="#">Home</a><a class="on" href="#">Videos</a><a href="#">Shorts</a><a href="#">Playlists</a><a href="#">Posts</a></nav>

  <section class="grid" id="grid"></section>
</div></main>

<script>
// temp mockup only: hardcoded data. The real site reads videos.json via fetch and filters by channel.
const hues = [190, 20, 280, 140, 330, 60, 220, 0];
const titles = ["Building a keyboard from scratch", "Fake trailer: DeepFake the movie", "Cheap desk setup tour", "Why cats ignore you",
  "Speedrun any% in 4:32", "Rainy city walk 4K", "HTML vs CSS: who wins", "I cooked ramen for 7 days"];
document.getElementById("grid").innerHTML = titles.map((t, i) => `
  <a href="#"><div class="thumb" style="background:linear-gradient(135deg,hsl(${hues[i % 8]} 60% 55%),hsl(${(hues[i % 8] + 50) % 360} 55% 30%))">
    <span class="dur">${3 + i}:${String(7 * i % 60).padStart(2, "0")}</span></div>
  <div class="title">${t}</div><div class="sub">${(i + 1) * 37}K views &middot; ${i + 1} weeks ago</div></a>`).join("");

const btn = document.getElementById("sub");
btn.onclick = () => { const on = btn.classList.toggle("on"); btn.textContent = on ? "Subscribed" : "Subscribe"; };
</script>
</body>
</html>
