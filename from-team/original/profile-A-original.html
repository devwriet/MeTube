<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>MeTube - Profile</title>
  <link rel="stylesheet" href="tokens.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
    }
    .header {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 32px;
      height: 32px;
      background-color: var(--accent);
      color: var(--on-accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    .icon-button {
      background: transparent;
      border: none;
      color: var(--text);
      cursor: pointer;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }
    .icon-button:hover {
      background-color: var(--surface-hover);
    }
    .search {
      display: flex;
      align-items: center;
      height: 40px;
      max-width: 500px;
      width: 100%;
    }
    .search-input {
      flex: 1;
      height: 100%;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
      padding: 0 16px;
      color: var(--text);
      outline: none;
    }
    .search-button {
      height: 100%;
      width: 60px;
      background-color: var(--chip);
      border: 1px solid var(--border);
      border-left: none;
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
      color: var(--text);
      cursor: pointer;
    }
    /* 채널 프로필 레이아웃 */
    .profile-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px;
    }
    .channel-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 32px;
    }
    .card-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: var(--accent);
    }
    .channel-info h1 {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .channel-info p {
      font-size: 14px;
      color: var(--text-sub);
    }
    .chip-container {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .chip {
      height: 32px;
      padding: 0 16px;
      border-radius: 8px;
      background-color: var(--chip);
      color: var(--text);
      border: none;
      cursor: pointer;
    }
    .chip:hover {
      background-color: var(--chip-hover);
    }
    .chip-active {
      background-color: var(--text);
      color: var(--bg);
      font-weight: bold;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: transparent;
      border-radius: 12px;
      cursor: pointer;
      padding: 8px;
    }
    .card:hover {
      background-color: var(--surface-hover);
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--chip);
      border-radius: 12px;
      position: relative;
    }
    .card-duration {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background-color: var(--bg);
      color: var(--text);
      font-size: 12px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .card-body {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }
    .card-avatar-sm {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--accent);
      flex-shrink: 0;
    }
    .card-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .card-channel, .card-stats {
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <!-- 헤더 영역 -->
  <header class="header">
    <div class="header-left">
      <button class="icon-button">☰</button>
      <div class="logo">M</div>
    </div>
    <div class="search">
      <input type="text" class="search-input" placeholder="검색">
      <button class="search-button">🔍</button>
    </div>
    <div class="header-right">
      <button class="icon-button">🔔</button>
      <button class="icon-button">👤</button>
    </div>
  </header>

  <!-- 프로필 본문 영역 -->
  <div class="profile-container">
    <div class="channel-header">
      <div class="card-avatar"></div>
      <div class="channel-info">
        <h1>우피 (Woopi)</h1>
        <p>구독자 1.5만명 • 동영상 12개</p>
      </div>
    </div>

    <div class="chip-container">
      <button class="chip chip-active">동영상</button>
      <button class="chip">재생목록</button>
      <button class="chip">정보</button>
    </div>

    <div class="video-grid">
      <div class="card">
        <div class="card-thumb"><span class="card-duration">10:00</span></div>
        <div class="card-body">
          <div class="card-avatar-sm"></div>
          <div>
            <div class="card-title">MeTube 첫 번째 영상 테스트입니다</div>
            <div class="card-channel">우피 채널</div>
            <div class="card-stats">조회수 1.2만회 • 3일 전</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
