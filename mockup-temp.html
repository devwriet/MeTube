<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeTube mockup (temp)</title>
<style>
/* inverted YouTube dark palette; sizes measured from youtube.com 2026-10-20 */
:root {
  /* inverse of YouTube LIGHT theme, team palette values (255 - original) */
  --bg: #000000;      /* #ffffff */
  --chip: #0d0d0d;    /* #f2f2f2 */
  --hover: #262626;  /* hover fill; exact inverse #0d0d0d was 1.08:1 on --bg, invisible */
  --text: #f0f0f0;    /* #0f0f0f */
  --text-2: #9f9f9f;  /* #606060 */
  --accent: #0013de;  /* MeTube brand, team's choice (was #00ffcc = inverse of #ff0033); fills only, white text on it */
  --link: #f9a02b;    /* #065fd4 */
  --mint: #00ffcc;   /* inverse of brand red #ff0033 */
  --on-accent: #ffffff; /* text on --accent */
  --field-line: #606060; /* control border, 3.3:1 on --bg; exact inverse #333333 was 1.7:1 */
  --field-btn: #1a1a1a;  /* search button; lighter than exact inverse #070707, which looked too dark */
  --line: rgba(255,255,255,.1); /* derived: inverse of rgba(0,0,0,.1) */
}
* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px Roboto, Arial, sans-serif; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

.header { position: fixed; inset: 0 0 auto 0; height: 56px; display: flex; align-items: center;
  justify-content: space-between; padding: 0 16px; background: var(--bg); z-index: 2; }
.header .left, .header .right { display: flex; align-items: center; gap: 16px; min-width: 200px; }
.header .right { justify-content: flex-end; }
.logo { display: flex; align-items: center; gap: 4px; font-size: 20px; font-weight: 700; letter-spacing: -1px; }
.logo i { background: var(--accent); color: var(--on-accent); border-radius: 6px; padding: 4px 10px; font-style: normal; }
.search { display: flex; width: min(640px, 40vw); }
.search input { flex: 1; height: 40px; border: 1px solid var(--field-line); border-radius: 20px 0 0 20px; padding: 0 16px;
  background: var(--bg); color: var(--text); font-size: 16px; }
.search button { width: 64px; border: 1px solid var(--field-line); border-left: 0; border-radius: 0 20px 20px 0; background: var(--field-btn); color: var(--text); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); }
.icon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: none; border: 0; font-size: 18px; }
.icon:hover { background: var(--hover); }

.guide { position: fixed; top: 56px; bottom: 0; width: 240px; padding: 12px; overflow: auto; background: var(--bg); }
.guide a { display: flex; align-items: center; gap: 24px; height: 40px; padding: 0 12px; border-radius: 10px; }
.guide a:hover { background: var(--hover); }
.guide a.on { background: var(--chip); font-weight: 600; }
.guide hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }

.main { margin: 56px 0 0 240px; }
.chips { position: sticky; top: 56px; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 24px;
  background: var(--bg); border-bottom: 1px solid var(--line); z-index: 1; }
.chip { padding: 0 12px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--chip); font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--text); color: var(--bg); }

.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 40px 16px; padding: 24px; }
@media (max-width: 1500px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 1100px) { .guide { width: 72px; } .guide a { flex-direction: column; font-size: 11px; gap: 4px; height: 64px; justify-content: center; padding: 0; }
  .main { margin-left: 72px; } .grid { grid-template-columns: repeat(2, 1fr); } }

.thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; }
.dur { position: absolute; right: 8px; bottom: 8px; background: #000c; color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
.meta { display: flex; gap: 12px; margin-top: 12px; }
.meta .avatar { width: 36px; height: 36px; flex: none; }
.title { font-size: 16px; font-weight: 500; line-height: 22px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.sub { color: var(--text-2); font-size: 14px; line-height: 20px; margin-top: 4px; }
</style>
</head>
<body>
<header class="header">
  <div class="left"><button class="icon">&#9776;</button><a class="logo" href="#"><i>Me</i>Tube</a></div>
  <form class="search" onsubmit="return false"><input placeholder="Search"><button>&#128269;</button></form>
  <div class="right"><button class="icon">+</button><button class="icon">&#128276;</button><div class="avatar"></div></div>
</header>

<nav class="guide">
  <a class="on" href="#">&#8962; Home</a>
  <a href="#">&#9654; Shorts</a>
  <a href="#">&#9733; Subscriptions</a>
  <hr>
  <a href="#">&#9786; You</a>
  <a href="#">&#8635; History</a>
</nav>

<main class="main">
  <div class="chips">
    <span class="chip on">All</span><span class="chip">Music</span><span class="chip">Gaming</span>
    <span class="chip">Live</span><span class="chip">Cooking</span><span class="chip">Coding</span><span class="chip">Nature</span>
  </div>
  <section class="grid" id="grid"></section>
</main>

<script>
// temp mockup only: hardcoded cards. Real site builds these from videos.json via fetch.
const hues = [190, 20, 280, 140, 330, 60, 220, 0];
const titles = ["Building a keyboard from scratch", "I cooked ramen for 7 days", "Sunset timelapse over Seoul",
  "Learn JavaScript in 12 minutes", "Lo-fi beats to study to", "Speedrun any% in 4:32", "Why cats ignore you",
  "Mountain hike, no talking", "HTML vs CSS: who wins", "Fake trailer: DeepFake the movie", "Cheap desk setup tour", "Rainy city walk 4K"];
document.getElementById("grid").innerHTML = titles.map((t, i) => `
  <a href="#"><div class="thumb" style="background:linear-gradient(135deg,hsl(${hues[i % 8]} 60% 55%),hsl(${(hues[i % 8] + 50) % 360} 55% 30%))">
    <span class="dur">${3 + i}:${String(7 * i % 60).padStart(2, "0")}</span></div>
  <div class="meta"><div class="avatar" style="background:hsl(${hues[(i + 3) % 8]} 55% 45%)"></div>
  <div><div class="title">${t}</div><div class="sub">Channel ${i + 1}<br>${(i + 1) * 37}K views &middot; ${i + 1} days ago</div></div></div></a>`).join("");
</script>
</body>
</html>
